<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Strava 活动海报 · MapToPoster</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@400;700&family=Cormorant+Garamond:wght@600&family=Dancing+Script:wght@400;700&family=Inter:wght@400;700&family=Lora:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Raleway:wght@400;700&family=Roboto:wght@400;700&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="bg-[#f8fafc] h-screen flex flex-row overflow-hidden">

	<aside class="w-[340px] shrink-0 h-full overflow-y-auto bg-white border-r border-slate-100 px-5 py-5 space-y-6">
		<div>
			<h1 class="text-base font-bold text-slate-900">Strava 活动海报</h1>
			<p id="ext-activity-name" class="text-xs text-slate-500 mt-1 truncate">尚未载入活动</p>
			<p id="ext-activity-stats" class="text-[10px] text-slate-400 mt-0.5"></p>
			<p id="ext-nodata" class="hidden mt-3 text-[11px] leading-relaxed text-amber-600 bg-amber-50 border border-amber-100 rounded-xl px-3 py-2">
				还没有活动数据。请在 Strava 活动页点击右下角的「🗺 生成活动海报」，或用下方的按钮手动导入一个 GPX 文件。
			</p>
		</div>

		<div class="space-y-4">
			<h3 class="text-sm font-semibold text-slate-900">地图</h3>

			<div class="bg-slate-100 p-1 rounded-xl flex">
				<button id="ext-mode-tile" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all">标准</button>
				<button id="ext-mode-artistic" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all">艺术</button>
			</div>

			<div id="ext-standard-wrap" class="space-y-4">
				<div>
					<span class="label-sm">颜色主题</span>
					<div class="relative">
						<select id="ext-theme-select" class="input-field appearance-none cursor-pointer"></select>
						<svg class="w-4 h-4 text-slate-400 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
						</svg>
					</div>
				</div>
				<div class="flex items-center justify-between">
					<span class="label-sm mb-0">显示地名标注</span>
					<label class="relative inline-flex items-center cursor-pointer">
						<input type="checkbox" id="ext-labels-toggle" class="sr-only peer">
						<div class="toggle-pill"></div>
					</label>
				</div>
			</div>

			<div id="ext-artistic-wrap" class="space-y-4 hidden">
				<div>
					<span class="label-sm">艺术主题</span>
					<div class="relative">
						<select id="ext-artistic-select" class="input-field appearance-none cursor-pointer"></select>
						<svg class="w-4 h-4 text-slate-400 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
						</svg>
					</div>
				</div>

				<div class="flex items-center gap-2 flex-wrap">
					<button id="ext-ct-new" class="px-3 py-1.5 rounded-lg border border-dashed border-slate-300 text-[10px] font-bold text-slate-500 hover:border-blue-300 hover:text-blue-600 transition-all">＋ 新建主题</button>
					<button id="ext-ct-edit" class="px-3 py-1.5 rounded-lg border border-slate-200 text-[10px] font-bold text-slate-500 hover:border-blue-300 hover:text-blue-600 transition-all">编辑当前自定义主题</button>
					<button id="ext-ct-export" class="px-2 py-1.5 text-[10px] font-bold text-slate-400 hover:text-slate-600 transition-colors">导出</button>
					<button id="ext-ct-import" class="px-2 py-1.5 text-[10px] font-bold text-slate-400 hover:text-slate-600 transition-colors">导入</button>
					<button id="ext-ct-clear" class="px-2 py-1.5 text-[10px] font-bold text-slate-400 hover:text-red-500 transition-colors">清空</button>
					<input type="file" id="ext-ct-import-file" accept=".json,application/json" class="hidden" />
				</div>

				<div id="ext-ct-editor" class="hidden space-y-3 bg-slate-50/60 border border-slate-100 rounded-2xl p-3">
					<div>
						<span class="label-sm">主题名称</span>
						<input id="ct-name" type="text" maxlength="40" placeholder="My Custom Theme" class="input-field mt-1" />
					</div>
					<div>
						<span class="label-sm">描述（可选）</span>
						<input id="ct-desc" type="text" maxlength="80" placeholder="Optional short description" class="input-field mt-1" />
					</div>
					<div class="grid grid-cols-2 gap-3" id="ext-ct-fields"></div>
					<div class="flex items-center gap-2 pt-1">
						<button id="ext-ct-save" class="flex-1 py-2 rounded-xl bg-slate-900 text-white text-[10px] font-bold uppercase tracking-wider hover:bg-slate-800 transition-all">保存主题</button>
						<button id="ext-ct-delete" class="hidden px-3 py-2 rounded-xl bg-red-50 text-red-500 text-[10px] font-bold uppercase tracking-wider hover:bg-red-100 transition-all">删除</button>
						<button id="ext-ct-cancel" class="px-3 py-2 rounded-xl border border-slate-200 text-[10px] font-bold text-slate-500 hover:bg-slate-50 transition-all">取消</button>
					</div>
				</div>
			</div>
		</div>

		<div class="space-y-4">
			<h3 class="text-sm font-semibold text-slate-900">轨迹</h3>

			<div class="grid grid-cols-2 gap-3">
				<div>
					<span class="label-sm">轨迹颜色</span>
					<div class="flex items-center space-x-2 bg-white border border-slate-200 rounded-xl px-2 py-1.5 shadow-sm">
						<input type="color" id="ext-color" value="#EF4444" class="w-9 h-9 rounded-lg cursor-pointer shrink-0 border-0 p-0" />
						<input type="text" id="ext-color-hex" maxlength="7" class="text-xs font-mono text-slate-700 bg-transparent border-0 outline-none w-full p-0" placeholder="#ef4444" />
					</div>
				</div>
				<div>
					<div class="flex justify-between items-center mb-1.5">
						<span class="label-sm mb-0">线宽</span>
						<span id="ext-width-value" class="text-[9px] font-bold text-accent">4px</span>
					</div>
					<input type="range" id="ext-width-slider" min="2" max="10" step="1" value="4" class="w-full h-1 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-accent" />
				</div>
			</div>

			<button id="ext-fit-btn" class="w-full py-2.5 px-3 rounded-xl bg-white border border-slate-200 shadow-sm text-[10px] font-bold text-slate-600 hover:border-blue-200 hover:bg-blue-50/30 hover:text-blue-600 transition-all">缩放地图到轨迹范围（Fit）</button>
		</div>

		<div class="space-y-4">
			<h3 class="text-sm font-semibold text-slate-900">文字</h3>
			<div>
				<span class="label-sm">主标题</span>
				<input type="text" id="ext-title-input" class="input-field mt-1" placeholder="活动名称" />
			</div>
			<div>
				<span class="label-sm">副标题</span>
				<input type="text" id="ext-subtitle-input" class="input-field mt-1" placeholder="如 105.1 KM · 2026-10-15" />
			</div>
			<div class="flex items-center justify-between">
				<span class="label-sm mb-0">显示坐标</span>
				<label class="relative inline-flex items-center cursor-pointer">
					<input type="checkbox" id="ext-coords-toggle" class="sr-only peer">
					<div class="toggle-pill"></div>
				</label>
			</div>
		</div>

		<div class="space-y-4">
			<h3 class="text-sm font-semibold text-slate-900">尺寸与导出</h3>
			<div>
				<span class="label-sm">预设尺寸</span>
				<div class="relative">
					<select id="ext-preset-select" class="input-field appearance-none cursor-pointer"></select>
					<svg class="w-4 h-4 text-slate-400 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
					</svg>
				</div>
			</div>
			<div class="grid grid-cols-2 gap-3">
				<div>
					<span class="label-sm">宽度 px</span>
					<input type="number" id="ext-custom-w" class="input-field text-center font-mono text-xs" />
				</div>
				<div>
					<span class="label-sm">高度 px</span>
					<input type="number" id="ext-custom-h" class="input-field text-center font-mono text-xs" />
				</div>
			</div>

			<input type="file" id="ext-file-input" accept=".gpx,application/gpx+xml" class="hidden" />
			<button id="ext-import-btn" class="w-full py-2.5 px-3 rounded-xl bg-white border border-slate-200 shadow-sm text-[10px] font-bold text-slate-600 hover:border-blue-200 hover:bg-blue-50/30 hover:text-blue-600 transition-all">手动导入 GPX 文件</button>

			<button id="ext-export-btn" class="w-full py-3.5 px-4 rounded-2xl bg-slate-900 text-white text-xs font-bold uppercase tracking-widest hover:bg-slate-800 transition-all shadow-lg">导出 PNG 海报</button>
			<p id="ext-status" class="text-[10px] text-slate-400 text-center"></p>
		</div>
	</aside>

	<main class="flex-1 relative flex items-center justify-center overflow-hidden">
		<div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none opacity-40">
			<div class="absolute -top-[15%] -left-[15%] w-[55%] h-[55%] bg-accent-soft blur-[100px] rounded-full"></div>
			<div class="absolute -bottom-[15%] -right-[15%] w-[55%] h-[55%] bg-accent-soft blur-[100px] rounded-full"></div>
		</div>

		<div id="poster-scaler" class="transition-all duration-500 ease-out origin-center">
			<div id="poster-container" class="relative bg-white shadow-[0_50px_100px_-20px_rgba(0,0,0,0.3)] ring-1 ring-black/5 overflow-hidden">
				<div id="map-preview" class="absolute inset-0 z-0 grayscale-[0.2]"></div>
				<div id="artistic-map" class="absolute inset-0 z-[1]"></div>
				<div id="mat-border" class="absolute pointer-events-none z-[6]"></div>
				<div id="vignette-overlay" class="absolute inset-0 z-[5] pointer-events-none"></div>

				<div id="poster-overlay" class="absolute z-10 flex flex-col items-center justify-center text-center cursor-grab active:cursor-grabbing select-none">
					<div class="overlay-bg absolute inset-0 -z-10"></div>

					<h2 id="display-city" class="text-6xl md:text-8xl font-bold uppercase tracking-[0.25em] pl-[0.25em] text-slate-900 font-serif break-words w-full leading-tight">JAKARTA</h2>

					<div id="poster-divider" class="h-px w-32 bg-slate-900 opacity-80"></div>
					<p id="display-country" class="text-lg md:text-xl tracking-[0.4em] pl-[0.4em] font-bold text-slate-900 uppercase">INDONESIA</p>
					<p id="display-coords" class="text-base md:text-lg tracking-[0.4em] pl-[0.4em] font-medium text-slate-600">6.2088° S / 106.8456° E</p>
				</div>
				<div id="poster-attribution" class="absolute bottom-4 right-4 z-20 text-[8px] opacity-30 pointer-events-none uppercase tracking-widest">© OpenStreetMap Contributors</div>
			</div>
		</div>
	</main>

	<script type="module" src="/src/ext/poster-page.js"></script>
</body>

</html>
